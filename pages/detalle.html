<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizardly — Detalle del Producto</title>

    <link rel="icon" href="../images/favicon/favicon.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Lato:wght@300;400;700&family=Jim+Nightshade&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/catalogo.css">
    <link rel="stylesheet" href="../css/carrito.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ESTILOS EXCLUSIVOS PARA EL NUEVO BOTÓN DE OPINIÓN -->
    <style>
        .btn-opinion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 12px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-opinion:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>

<body data-page="detalle">
    <div id="navbar-placeholder"></div>
    
    <!-- HERO -->
    <section class="hero-detalle">
        <div class="hero-content">
            <span class="hero-eyebrow">✦ Artefacto ✦</span>
            <h2>Detalle del Producto</h2>
        </div>
    </section>

    <!-- DETALLE -->
    <section class="detalle-section">
        <div class="detalle-container" id="detalle-container">
            <!-- Cargando contenido dinámicamente -->
        </div>
    </section>

    <!-- PRODUCTOS RELACIONADOS -->
    <section class="relacionados-section">
        <div class="section-header">
            <span class="section-eyebrow">✦ También te puede interesar ✦</span>
            <h3>Productos Relacionados</h3>
        </div>
        <div class="catalogo-grid" id="relacionados-container">
            <!-- Cargando contenido dinámicamente -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-mini">
        <p>
            © 2026 <span>Wizardly</span> — Mercado Arcano
            &nbsp;✦&nbsp; Todos los derechos mágicos reservados
        </p>
        <div class="footer-links">
            <a href="politicas.html">Políticas de Compra y Venta</a>
        </div>
    </footer>

    <!-- Scripts-->
    <script src="../js/carrito.js"></script>
    <script src="../js/cargar-navbar.js"></script>
    <script src="../js/script.js"></script>
    
    <!-- ── SCRIPT CONECTADO A FIREBASE ── -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Tus credenciales reales de Wizardly
        const firebaseConfig = {
            apiKey: "AIzaSyAWS58ylvzDdDF8UmzrybqXQVj9JnAmT8U",
            authDomain: "wizardly-nextstage.firebaseapp.com",
            projectId: "wizardly-nextstage",
            storageBucket: "wizardly-nextstage.firebasestorage.app",
            messagingSenderId: "336735978219",
            appId: "1:336735978219:web:15a92d2b473cbb6f82b4ae",
            measurementId: "G-FE1XKG7BFF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables globales para manejar cantidad y el producto que estamos viendo
        let cantidadLocal = 1;
        let productoActualGlobal = null;

        // Exponemos las funciones al entorno global para que los botones HTML "onclick" las encuentren
        window.cambiarCantidadLocal = (delta) => {
            cantidadLocal = Math.max(1, cantidadLocal + delta);
            document.getElementById('cantidad-valor').textContent = cantidadLocal;
        };

        window.agregarEsteProducto = () => {
            if (productoActualGlobal) {
                // agregarAlCarrito viene de tu script carrito.js
                agregarAlCarrito(productoActualGlobal, cantidadLocal);
                
                // Efecto visual en el botón
                const btn = document.getElementById('btn-agregar');
                const textoOriginal = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> ¡Hechizo Exitoso!`;
                btn.style.background = "var(--success, #4ade80)";
                btn.style.color = "#111";
                setTimeout(() => {
                    btn.innerHTML = textoOriginal;
                    btn.style.background = "";
                    btn.style.color = "";
                }, 2000);
            }
        };

        async function cargarDetalle() {
            // Extraer el ID alfanumérico que manda Firebase desde el catálogo
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById('detalle-container');

            if (!id) {
                container.innerHTML = `<p class="detalle-error" style="text-align:center; color: var(--text-muted); font-family: 'Cinzel', serif;">⚠️ Artefacto no especificado en el grimorio.</p>`;
                return;
            }

            container.innerHTML = "<p style='text-align: center; color: var(--gold); font-family: Cinzel, serif;'><i class='fa-solid fa-wand-magic-sparkles fa-spin'></i> Revelando secretos del artefacto...</p>";

            try {
                // Buscamos el documento exacto en Firestore
                const docRef = doc(db, "productos", id);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = `<p class="detalle-error" style="text-align:center; color: #f87171; font-family: 'Cinzel', serif;">⚠️ Artefacto perdido en el tiempo. No encontrado.</p>`;
                    return;
                }

                const producto = docSnap.data();
                producto.id = docSnap.id; 
                productoActualGlobal = producto;

                // Validaciones para que no falle si algún dato está en blanco
                const imagenSegura = producto.imagen ? producto.imagen : "../images/logo/Logo.png";
                const precioSeguro = parseFloat(producto.precio) || 0;
                const descSegura = producto.descripcion || "Un misterioso artefacto cuyas propiedades aún están siendo estudiadas por nuestros magos.";
                const tieneEtiqueta = producto.etiqueta && producto.etiqueta.trim() !== "";

                // Inyectamos el diseño con los datos reales
                container.innerHTML = `
                    <div class="detalle-card">
                        <div class="detalle-imagen">
                            ${tieneEtiqueta ? `<span class="detalle-etiqueta ${producto.etiqueta.toLowerCase()}">${producto.etiqueta}</span>` : ''}
                            <img src="${imagenSegura}" alt="${producto.nombre}">
                        </div>
                        <div class="detalle-info">
                            <p class="detalle-categoria">${producto.categoria || 'Artefacto Mágico'}</p>
                            <h3>${producto.nombre}</h3>
                            <p class="detalle-precio">$${precioSeguro.toFixed(2)} <span>MXN</span></p>
                            <p class="detalle-descripcion">${descSegura}</p>

                            <!-- Selector de cantidad -->
                            <div class="cantidad-wrap">
                                <span class="cantidad-label">Cantidad</span>
                                <div class="cantidad-control">
                                    <button class="cantidad-btn" id="btn-menos" onclick="cambiarCantidadLocal(-1)">−</button>
                                    <span class="cantidad-valor" id="cantidad-valor">1</span>
                                    <button class="cantidad-btn" id="btn-mas" onclick="cambiarCantidadLocal(1)">+</button>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="detalle-btns">
                                <button class="btn" id="btn-agregar" onclick="agregarEsteProducto()">
                                    <i class="fa-solid fa-cart-plus"></i> Agregar al carrito
                                </button>
                                
                                <a href="opiniones.html" class="btn-opinion">
                                    <i class="fa-solid fa-pen-fancy"></i> Dejar opinión
                                </a>

                                <a href="catalogo.html" class="btn-regresar">
                                    <i class="fa-solid fa-arrow-left"></i> Regresar
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                // Mandamos llamar los relacionados pasando la categoría
                cargarRelacionados(producto.categoria, producto.id);

            } catch (error) {
                console.error("Error oscuro al obtener detalle:", error);
                container.innerHTML = `<p class="detalle-error" style="text-align:center; color: #f87171;">⚠️ Ocurrió una interferencia mágica al conectarse a la bóveda.</p>`;
            }
        }

        async function cargarRelacionados(categoria, currentId) {
            const container = document.getElementById('relacionados-container');
            container.innerHTML = "<p style='text-align: center; color: var(--text-muted); font-family: Cinzel, serif; grid-column: 1/-1;'>Buscando ecos mágicos similares...</p>";

            try {
                // Buscamos productos que sean de la misma categoría que el producto actual
                let q = query(collection(db, "productos"), where("categoria", "==", categoria), limit(6));
                let snap = await getDocs(q);
                
                let relacionados = [];
                snap.forEach(doc => {
                    // Excluimos el producto que ya estamos viendo y evitamos mostrar inactivos
                    if(doc.id !== currentId && doc.data().estado !== 'Inactivo') {
                        let data = doc.data();
                        data.id = doc.id;
                        relacionados.push(data);
                    }
                });

                // Si no hay de la misma categoría, traemos cualquier producto activo
                if (relacionados.length === 0) {
                    const fallbackQ = query(collection(db, "productos"), where("estado", "==", "Activo"), limit(5));
                    const fallbackSnap = await getDocs(fallbackQ);
                    fallbackSnap.forEach(doc => {
                        if(doc.id !== currentId) {
                            let data = doc.data();
                            data.id = doc.id;
                            relacionados.push(data);
                        }
                    });
                }

                container.innerHTML = '';
                
                // Mostrar máximo 4 tarjetas
                relacionados.slice(0, 4).forEach(prod => {
                    const imagenSegura = prod.imagen ? prod.imagen : "../images/logo/Logo.png";
                    const precioSeguro = parseFloat(prod.precio) || 0;
                    const tieneEtiqueta = prod.etiqueta && prod.etiqueta.trim() !== "";

                    const card = document.createElement('div');
                    card.className = 'producto-card';
                    card.innerHTML = `
                        ${tieneEtiqueta ? `<span class="etiqueta ${prod.etiqueta.toLowerCase()}">${prod.etiqueta}</span>` : ''}
                        <img src="${imagenSegura}" alt="${prod.nombre}" loading="lazy">
                        <h3>${prod.nombre}</h3>
                        <p class="producto-precio">$${precioSeguro.toFixed(2)} MXN</p>
                        <a href="detalle.html?id=${prod.id}" class="btn-detalle">Ver detalle</a>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar relacionados:", error);
                container.innerHTML = ""; // Simplemente dejamos vacía la sección si falla
            }
        }

        // Ejecutar al entrar a la página
        cargarDetalle();
    </script>
</body>
</html>
